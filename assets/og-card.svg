<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'IBM Plex Mono', Consolas, monospace">
  <!-- BACKGROUND: deep navy with subtle radial gradients -->
  <defs>
    <radialGradient id="bgGradient" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f1f3a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0a1628" stop-opacity="1"/>
      <stop offset="100%" stop-color="#070d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="ccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="codexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10a37f"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGradient)"/>

  <!-- subtle grid background lines -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.18">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- ACCENT GLOW top-right (EU stars area) -->
  <circle cx="1140" cy="100" r="180" fill="url(#accentAmber)" opacity="0.06"/>

  <!-- EU STAR RING — 12 stars in the European-flag style, top-right corner -->
  <g transform="translate(1140, 100)" fill="#fbbf24" opacity="0.85">
    <g id="euStar">
      <polygon points="0,-8 2.35,-2.45 8,-2.45 3.4,1 5.15,6.5 0,3.5 -5.15,6.5 -3.4,1 -8,-2.45 -2.35,-2.45"/>
    </g>
    <use href="#euStar" transform="translate(0 -55)"/>
    <use href="#euStar" transform="translate(27.5 -47.6)"/>
    <use href="#euStar" transform="translate(47.6 -27.5)"/>
    <use href="#euStar" transform="translate(55 0)"/>
    <use href="#euStar" transform="translate(47.6 27.5)"/>
    <use href="#euStar" transform="translate(27.5 47.6)"/>
    <use href="#euStar" transform="translate(0 55)"/>
    <use href="#euStar" transform="translate(-27.5 47.6)"/>
    <use href="#euStar" transform="translate(-47.6 27.5)"/>
    <use href="#euStar" transform="translate(-55 0)"/>
    <use href="#euStar" transform="translate(-47.6 -27.5)"/>
    <use href="#euStar" transform="translate(-27.5 -47.6)"/>
  </g>
  <text x="1140" y="220" text-anchor="middle" fill="#fbbf24" opacity="0.6" font-size="14" font-weight="500">EU AI Act 2024/1689</text>

  <!-- ===== TOP-LEFT: skill name + horizontal accent ===== -->
  <text x="80" y="120" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="-1.5">ai-act-skills</text>
  <line x1="80" y1="148" x2="280" y2="148" stroke="url(#accentBlue)" stroke-width="3"/>

  <!-- subhead -->
  <text x="80" y="186" fill="#94a3b8" font-size="22" font-weight="400">EU AI Act compliance — runs anywhere agents run</text>

  <!-- ===== CENTER: 3 platform pills connected ===== -->
  <!-- Connecting line behind pills -->
  <line x1="180" y1="335" x2="900" y2="335" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Claude Code pill -->
  <g transform="translate(80, 285)">
    <rect width="240" height="100" rx="14" fill="url(#ccGrad)" filter="url(#softShadow)"/>
    <text x="120" y="44" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="500" opacity="0.85" letter-spacing="2">RUNTIME</text>
    <text x="120" y="76" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Claude Code</text>
  </g>

  <!-- Gemini CLI pill -->
  <g transform="translate(360, 285)">
    <rect width="240" height="100" rx="14" fill="url(#geminiGrad)" filter="url(#softShadow)"/>
    <text x="120" y="44" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="500" opacity="0.85" letter-spacing="2">RUNTIME</text>
    <text x="120" y="76" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Gemini CLI</text>
  </g>

  <!-- OpenAI Codex pill -->
  <g transform="translate(640, 285)">
    <rect width="240" height="100" rx="14" fill="url(#codexGrad)" filter="url(#softShadow)"/>
    <text x="120" y="44" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="500" opacity="0.85" letter-spacing="2">RUNTIME</text>
    <text x="120" y="76" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">OpenAI Codex</text>
  </g>

  <!-- ZERO LOCK-IN tag right of the row -->
  <g transform="translate(920, 285)">
    <rect width="280" height="100" rx="14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="140" y="44" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="500" opacity="0.9" letter-spacing="2">SSL MANIFEST</text>
    <text x="140" y="76" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="700">tool_calls: false</text>
  </g>

  <!-- ===== ANCHOR LABELS ===== -->
  <g transform="translate(80, 432)">
    <text x="0" y="0" fill="#cbd5e1" font-size="18" font-weight="500" letter-spacing="0.5">Anchored on</text>
    <text x="125" y="0" fill="#60a5fa" font-size="18" font-weight="700">ISO/IEC 42001:2023</text>
    <text x="345" y="0" fill="#cbd5e1" font-size="18" font-weight="500">AIMS</text>
    <text x="402" y="0" fill="#cbd5e1" font-size="18" font-weight="400" opacity="0.6">·</text>
    <text x="420" y="0" fill="#60a5fa" font-size="18" font-weight="700">ISO/IEC 27090:2025</text>
    <text x="640" y="0" fill="#cbd5e1" font-size="18" font-weight="500">AI cybersecurity</text>
  </g>

  <!-- ===== BOTTOM-LEFT: citation snippet (the "moat") ===== -->
  <g transform="translate(80, 490)">
    <rect width="640" height="92" rx="10" fill="#0f1f3a" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-size="13" font-weight="500" letter-spacing="1.5">CITATION-GRADE OUTPUT</text>
    <text x="20" y="64" fill="#34d399" font-size="20" font-weight="600">art. 9(2)(a)</text>
    <text x="155" y="64" fill="#94a3b8" font-size="20" font-weight="400">→ ISO/IEC 42001</text>
    <text x="345" y="64" fill="#a78bfa" font-size="20" font-weight="600">cl. 6.1.4</text>
    <text x="445" y="64" fill="#94a3b8" font-size="20" font-weight="400">+</text>
    <text x="475" y="64" fill="#fbbf24" font-size="20" font-weight="600">A.5.4</text>
  </g>

  <!-- ===== BOTTOM-RIGHT: install command + repo handle ===== -->
  <g transform="translate(760, 490)">
    <rect width="440" height="92" rx="10" fill="#0f1f3a" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-size="13" font-weight="500" letter-spacing="1.5">INSTALL</text>
    <text x="20" y="64" fill="#ffffff" font-size="17" font-weight="500">$</text>
    <text x="38" y="64" fill="#34d399" font-size="17" font-weight="500">npx skills add</text>
    <text x="190" y="64" fill="#ffffff" font-size="17" font-weight="500">abk1969/ai-act-skills</text>
  </g>

  <!-- bottom corner: github handle -->
  <text x="80" y="612" fill="#475569" font-size="13" font-weight="500" letter-spacing="0.5">github.com/abk1969/ai-act-skills</text>
  <text x="1200" y="612" text-anchor="end" fill="#475569" font-size="13" font-weight="500" letter-spacing="0.5">v1.2.1 · MIT · arXiv:2604.24026</text>
</svg>
